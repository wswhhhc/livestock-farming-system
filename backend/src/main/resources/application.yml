server:
  port: 8088

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/livestock_farming?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:252629}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.livestock.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

ai:
  enabled: true
  api-url: https://api.siliconflow.cn/v1/chat/completions
  api-key: ${AI_API_KEY:}
  model: deepseek-ai/DeepSeek-V3
